<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQ Solar Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                    <circle cx="12" cy="12" r="4"/>
                </svg>
                <h1>Mạnh Quân Solar</h1>
            </div>
            <div class="status-indicator">
                <span class="dot online"></span> Live
            </div>
        </header>

        <main id="devices-container">
            <!-- Dynamic content will be injected here by script.js -->
        </main>
        
        <footer>
            <div class="device-info" style="margin-bottom: 12px; font-size: 0.85rem; color: var(--text-secondary);">
                <span>Token chung: <strong id="val-api-token">--</strong></span>
            </div>
            <p>Trạng thái cập nhật: <span id="last-update">Đang chờ...</span></p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
